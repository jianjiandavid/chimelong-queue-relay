name: 长隆排队数据采集

on:
  schedule:
    # 每10分钟运行一次，北京时间 10:00-19:30 (UTC 02:00-11:30)
    # cron: '*/10 2-11 * * *' 每天UTC 02:00-11:50 运行
    - cron: '*/10 2-11 * * *'
  workflow_dispatch: # 支持手动触发

env:
  SERVER_URL: http://8.148.181.106:3000
  RELAY_TOKEN: chimelong2026

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 运行数据采集脚本
        env:
          FORCE_COLLECT: ${{ github.event_name == 'workflow_dispatch' }}
        run: python relay.py
